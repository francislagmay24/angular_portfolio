<section class="auth-page">
  <div class="auth-card">
    <header class="auth-head">
      <h1>Sign in</h1>
      <p>This demo signs you in against the <code>users</code> table in MySQL.</p>
    </header>

    <form (ngSubmit)="submit()" #f="ngForm" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
          autofocus
        />
      </div>

      <div class="field">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <p class="auth-error" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="auth-submit" [disabled]="submitting() || f.invalid">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="auth-demo">
      <p class="auth-demo-title">Demo credentials</p>
      <p><code>admin@example.com</code> / <code>Passw0rd!</code></p>
      <p class="auth-demo-note">
        Seeded by <code>Database/schema.sql</code>. Delete that account before deploying.
      </p>
    </div>

    <a routerLink="/" class="auth-back">&larr; Back to portfolio</a>
  </div>
</section>
